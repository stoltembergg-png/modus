name: apply-ui-aurora-effort
on:
  push:
    branches: [cursor/ui-aurora-effort-browser-locale-5588]
    paths:
      - ".github/tmp/ui-aurora-effort/trigger"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/ui-aurora-effort-browser-locale-5588
      - name: Apply patch commit cleanup push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply .github/tmp/ui-aurora-effort/remaining.patch
          git add \
            apps/desktop/src/renderer/src/features/composer/Composer.tsx \
            apps/desktop/src/renderer/src/styles/app.css
          git commit -m "fix(composer): Prompt Bar purple spark effort styling"
          git rm -rf .github/tmp/ui-aurora-effort
          git rm -f .github/workflows/apply-ui-aurora-effort.yml
          git commit -m "chore: remove ui-aurora-effort apply staging"
          git push
