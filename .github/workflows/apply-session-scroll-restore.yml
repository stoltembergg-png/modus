name: apply-session-scroll-restore
on:
  push:
    branches: [cursor/fix-session-scroll-restore-5588]
    paths:
      - ".github/tmp/scroll-restore-trigger"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-session-scroll-restore-5588
      - name: Assemble extract commit push
        run: |
          set -euo pipefail
          cat .github/tmp/scroll-part* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/files.tar.gz
          tar -xzf /tmp/files.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src/renderer/src/components/ui/ThoughtLine.tsx \
            apps/desktop/src/renderer/src/features/agent/ChatPane.tsx
          git status
          git commit -m "fix(chat): ThoughtLine closed init + ChatPane session scroll restore" || true
          git rm -f .github/tmp/scroll-part* .github/tmp/scroll-restore-trigger || true
          git rm -f .github/workflows/apply-session-scroll-restore.yml || true
          git commit -m "chore: remove session scroll restore apply staging" || true
          git push
