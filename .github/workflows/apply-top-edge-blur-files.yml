name: apply-top-edge-blur-files
on:
  push:
    branches: [cursor/upstream-ui-polish-5588]
    paths:
      - ".github/agent-staging/**"
      - ".github/workflows/apply-top-edge-blur-files.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/upstream-ui-polish-5588
      - name: Decode full files, commit, cleanup
        env:
          COMMIT_MSG: |
            fix(ui): top-edge gradient blur instead of full-chat blur

            Per-block filter blur smeared tall messages; use sticky viewport chrome
            with backdrop-filter + mask so blur is strongest at the top edge only.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          decode() {
            stem="$1"
            dest="$2"
            mkdir -p "$(dirname "$dest")"
            if [ -f ".github/agent-staging/${stem}.gz.b64" ]; then
              base64 -d < ".github/agent-staging/${stem}.gz.b64" | gzip -d > "$dest"
            else
              cat .github/agent-staging/"${stem}".gz.b64.part* | base64 -d | gzip -d > "$dest"
            fi
            echo "wrote $dest ($(wc -c < "$dest") bytes)"
          }

          decode apps__desktop__src__renderer__src__features__agent__Timeline.tsx \
            apps/desktop/src/renderer/src/features/agent/Timeline.tsx
          decode apps__desktop__src__renderer__src__features__agent__ChatPane.tsx \
            apps/desktop/src/renderer/src/features/agent/ChatPane.tsx
          decode apps__desktop__src__renderer__src__styles__app.css \
            apps/desktop/src/renderer/src/styles/app.css

          grep -q chat-scroll-top-blur apps/desktop/src/renderer/src/styles/app.css
          grep -qv PLACEHOLDER apps/desktop/src/renderer/src/features/agent/Timeline.tsx

          git add \
            apps/desktop/src/renderer/src/features/agent/Timeline.tsx \
            apps/desktop/src/renderer/src/features/agent/ChatPane.tsx \
            apps/desktop/src/renderer/src/styles/app.css
          printf '%s' "$COMMIT_MSG" | git commit -F -
          git rm -rf .github/agent-staging
          git rm -f .github/workflows/apply-top-edge-blur-files.yml
          git commit -m "chore: remove top-edge-blur file staging"
          git push
