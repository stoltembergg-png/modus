name: apply-thinking-css
on:
  push:
    branches: [cursor/thinking-states-fix-5588]
    paths:
      - .github/workflows/apply-thinking-css.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/thinking-states-fix-5588
      - name: Apply thinking-states CSS patch and self-delete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          patch = base64.b64decode("").decode()
          pathlib.Path("/tmp/thinking-css.patch").write_text(patch)
          PY
          git apply /tmp/thinking-css.patch || patch -p1 < /tmp/thinking-css.patch
          grep -q 't-think-shimmer' apps/desktop/src/renderer/src/styles/app.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/renderer/src/styles/app.css
          git commit -m "fix(ui): Thinking states single-line shimmer swap"
          rm -f .github/workflows/apply-thinking-css.yml
          git add -A .github/workflows/apply-thinking-css.yml || true
          git status
          if git diff --cached --quiet; then
            # still need to remove workflow if tracked
            git rm -f .github/workflows/apply-thinking-css.yml || true
          fi
          git commit -m "chore: remove temporary apply-thinking-css staging" || true
          git push
