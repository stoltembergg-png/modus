name: apply-top-edge-blur
on:
  push:
    branches: [cursor/top-edge-blur-fix-5588]
    paths:
      - .github/workflows/apply-top-edge-blur.yml
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-blur]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/top-edge-blur-fix-5588
      - name: Apply remaining blur fix files, commit, self-delete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          patch = base64.b64decode("""""").decode()
          pathlib.Path('/tmp/top-edge-blur.patch').write_text(patch)
          PY
          git apply /tmp/top-edge-blur.patch
          grep -q 'chat-scroll-top-blur' apps/desktop/src/renderer/src/styles/app.css
          grep -q 'chat-scroll-top-blur' apps/desktop/src/renderer/src/features/agent/ChatPane.tsx
          ! grep -q 'topEdgeBlur' apps/desktop/src/renderer/src/features/agent/Timeline.tsx
          git config user.name "cursor[bot]"
          git config user.email "cursor[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src/renderer/src/features/agent/Timeline.tsx \
            apps/desktop/src/renderer/src/features/agent/ChatPane.tsx \
            apps/desktop/src/renderer/src/styles/app.css
          git commit -m "$(cat <<'EOF'
          fix(ui): top-edge gradient blur instead of full-chat blur

          Per-block filter blur smeared tall messages after PR #25. Use sticky
          viewport chrome with backdrop-filter + mask so blur is strongest at the
          top edge and fades to sharp below.
          EOF
          )"
          rm -f .github/workflows/apply-top-edge-blur.yml
          git add -A .github/workflows/
          git commit -m "chore: remove temporary apply-top-edge-blur staging" || true
          git push origin HEAD:cursor/top-edge-blur-fix-5588
