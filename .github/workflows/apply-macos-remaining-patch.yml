name: apply-macos-remaining-patch
on:
  push:
    branches: [cursor/macos-chrome-hide-stubs-5588]
    paths:
      - ".github/tmp/macos-chrome-trigger"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/macos-chrome-hide-stubs-5588
      - name: Apply patch commit and cleanup
        run: |
          set -euo pipefail
          git apply .github/tmp/macos-remaining.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src/preload/index.ts \
            apps/desktop/src/preload/types.ts \
            apps/desktop/src/renderer/src/app/App.tsx \
            apps/desktop/src/renderer/src/components/Sidebar.tsx
          git commit -m "fix(desktop): native macOS chrome; hide unimplemented nav"
          git rm -f .github/tmp/macos-remaining.patch \
            .github/tmp/macos-chrome-trigger \
            .github/tmp/macos-part0 \
            .github/tmp/probe.txt \
            .github/workflows/apply-macos-remaining-patch.yml || true
          git commit -m "chore: remove macos chrome apply staging" || true
          git push
