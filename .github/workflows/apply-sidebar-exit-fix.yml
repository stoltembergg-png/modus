name: apply-sidebar-exit-fix
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-sidebar-exit-fix.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/session-font-motion-5588
          fetch-depth: 0
      - name: Restore Sidebar, apply exit fix, remove workflow
        run: |
          set -euo pipefail
          TARGET="apps/desktop/src/renderer/src/components/Sidebar.tsx"
          git show 2a38c224c2ef62314cb9660c9fee13bb89a80cf6:"$TARGET" > "$TARGET"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/desktop/src/renderer/src/components/Sidebar.tsx")
          text = p.read_text()
          old = "exit={reduceMotion ? undefined : { opacity: 0, y: -4 }}"
          new = "exit={reduceMotion ? { opacity: 1 } : { opacity: 0, y: -4 }}"
          if old not in text:
              raise SystemExit(f"old pattern missing; line={next(l for l in text.splitlines() if 'exit={reduceMotion' in l)}")
          p.write_text(text.replace(old, new, 1))
          line = next(l for l in p.read_text().splitlines() if "exit={reduceMotion" in l)
          assert "{ opacity: 1 }" in line and "undefined" not in line, line
          print("ok", line.strip())
          PY
          rm -f .github/workflows/apply-sidebar-exit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(ui): omit undefined exit under exactOptionalPropertyTypes"
          git push origin HEAD:cursor/session-font-motion-5588
