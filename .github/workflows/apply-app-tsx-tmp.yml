name: apply-app-tsx-tmp
on:
  push:
    branches: [cursor/aurora-color-fade-5588]
    paths:
      - .github/workflows/apply-app-tsx-tmp.yml
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-app-tsx]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/aurora-color-fade-5588
          fetch-depth: 0
      - name: Restore App.tsx from a96dbb4 and tune Aurora
        run: |
          set -euo pipefail
          git show a96dbb488ec242128e0eddb578913a7f9a0d3d1c:apps/desktop/src/renderer/src/app/App.tsx \
            > apps/desktop/src/renderer/src/app/App.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/desktop/src/renderer/src/app/App.tsx")
          t = p.read_text()
          old = '<Aurora blend={0.55} className="opacity-90" speed={0.85} />'
          new = (
              "<Aurora\n"
              "                                amplitude={1.15}\n"
              "                                blend={0.65}\n"
              '                                className="opacity-95"\n'
              "                                speed={0.85}\n"
              "                              />"
          )
          if old not in t:
              raise SystemExit(f"expected Aurora snippet missing; file starts {t[:80]!r}")
          p.write_text(t.replace(old, new, 1))
          out = p.read_text()
          assert "amplitude={1.15}" in out
          assert "blend={0.65}" in out
          print("tuned App.tsx ok", len(out))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/renderer/src/app/App.tsx
          git commit -m "fix(ui): tune Aurora hero amplitude and blend"
          rm -f .github/workflows/apply-app-tsx-tmp.yml
          rm -rf .github/tmp
          git add -A .github/
          git commit -m "chore: remove temporary App.tsx apply artifacts" || true
          git push origin HEAD:cursor/aurora-color-fade-5588
