name: Refresh package-lock
on:
  workflow_dispatch:
  push:
    branches: [cursor/cleanup-maintainability-67ea]
    paths: ['.cursor-tmp/lock/READY']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/cleanup-maintainability-67ea
          fetch-depth: 0
          persist-credentials: true
      - name: Surgically refresh package-lock.json
        run: |
          set -euxo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          path = Path('package-lock.json')
          data = json.loads(path.read_text())
          pkgs = data['packages']
          root = pkgs.setdefault('', {})
          root['workspaces'] = ['apps/*']
          desk = pkgs.get('apps/desktop', {})
          deps = desk.get('dependencies', {})
          deps.pop('drizzle-orm', None)
          to_del = [
              k for k in list(pkgs)
              if k.startswith('packages/') or 'drizzle' in k
          ]
          for k in to_del:
              del pkgs[k]
          text = json.dumps(data, indent=2) + '\n'
          assert 'drizzle' not in text
          assert not [k for k in pkgs if k.startswith('packages/')]
          path.write_text(text)
          print('wrote', len(text), 'removed', len(to_del))
          PY
          rm -rf .cursor-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "chore: refresh package-lock after stub and drizzle removal"
          git push origin HEAD:cursor/cleanup-maintainability-67ea
