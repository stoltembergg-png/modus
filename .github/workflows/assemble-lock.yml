name: Refresh package-lock
on:
  workflow_dispatch:
  push:
    branches: [cursor/cleanup-maintainability-67ea]
    paths: ['.cursor-tmp/lock/READY']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/cleanup-maintainability-67ea
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate package-lock.json
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          python3 - <<'PY'
          from pathlib import Path
          data = Path('package-lock.json').read_text()
          assert 'drizzle' not in data, 'drizzle still present'
          assert '"packages/core"' not in data and '"packages/ui"' not in data
          print('lock size', len(data))
          PY
          rm -rf .cursor-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git add -u .cursor-tmp || true
          if git diff --cached --quiet; then
            echo 'No lockfile changes'
            exit 0
          fi
          git commit -m "chore: refresh package-lock after stub and drizzle removal"
          git push
