name: Refresh package-lock
on:
  workflow_dispatch:
  push:
    branches: [cursor/cleanup-maintainability-67ea]
    paths: ['.cursor-tmp/lock/READY']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/cleanup-maintainability-67ea
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      - name: Regenerate package-lock.json
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path('package-lock.json').read_text()
          assert 'drizzle' not in raw, 'drizzle still present'
          pkgs = json.loads(raw)['packages']
          stale = [k for k in pkgs if k.startswith('packages/')]
          assert not stale, stale
          print('lock size', len(raw), 'entries', len(pkgs))
          PY
          rm -rf .cursor-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh package-lock after stub and drizzle removal"
          git push
