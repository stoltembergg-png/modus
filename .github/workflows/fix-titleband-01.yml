name: fix-titleband-01
on:
  push:
    paths:
      - .github/workflows/fix-titleband-01.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/remove-chat-top-gap-5588
      - name: Concatenate segment files into titleband-01.b64
        run: |
          set -euo pipefail
          cat .github/agent-staging/titleband-01.seg.* > .github/agent-staging/titleband-01.b64
          rm -f .github/agent-staging/titleband-01.seg.*
          rm -f .github/workflows/fix-titleband-01.yml
          # verify length
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/agent-staging/titleband-01.b64')
          print('len', len(p.read_text()))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair titleband-01.b64 from segments"
          git push
