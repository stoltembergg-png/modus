name: apply-titleband-patch
# retrigger-after-patch
on:
  push:
    paths:
      - .github/workflows/apply-titleband-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/remove-chat-top-gap-5588
      - name: Apply patch and clean staging
        run: |
          set -euo pipefail
          patch -p1 < .github/agent-staging/titleband.patch
          rm -f .github/agent-staging/titleband.patch
          rm -f .github/workflows/apply-titleband-patch.yml
          # remove leftover b64 staging from earlier attempts
          rm -rf .github/agent-staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "$(cat <<'EOF'
          fix(ui): remove empty titleband above conversation chrome

          Fold the dedicated MenuBar out of the conversation layout so the chat
          toolbar sits flush with the window top. Keep MenuBar for settings,
          move Win/Linux window controls into the main header, and clear macOS
          traffic lights via the sidebar/toolbar drag strips.
          EOF
          )"
          git push
