name: apply-menubar-system-menu
on:
  push:
    branches: [cursor/macos-chrome-hide-stubs-5588]
    paths:
      - ".github/tmp/menubar-trigger"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/macos-chrome-hide-stubs-5588
      - name: Apply App.tsx MenuBar patch and cleanup
        run: |
          set -euo pipefail
          git apply .github/tmp/menubar-system-menu.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/renderer/src/app/App.tsx
          git commit -m "fix(desktop): use system menu bar on macOS"
          git rm -f .github/tmp/menubar-system-menu.patch \
            .github/tmp/menubar-trigger \
            .github/workflows/apply-menubar-system-menu.yml || true
          git commit -m "chore: remove menubar system-menu apply staging" || true
          git push
