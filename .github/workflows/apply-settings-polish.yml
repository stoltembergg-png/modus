name: apply-settings-polish
on:
  push:
    branches: [cursor/settings-polish-5588]
    paths:
      - ".github/agent-staging/settings-polish.patch"
      - ".github/workflows/apply-settings-polish.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/settings-polish-5588
      - name: Apply patch, commit, cleanup
        env:
          COMMIT_MSG: |
            fix(ui): polish expand motion, rules example, provider select-all

            Slow expand/collapse transitions so panel chrome feels less abrupt.
            Add an editable AGENTS.md example in Settings → Rules, and Enable all /
            Disable all for every model under a provider in Model & Provider.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply .github/agent-staging/settings-polish.patch
          git add \
            apps/desktop/src/main/agent/model-service.ts \
            apps/desktop/src/main/ipc/channels.ts \
            apps/desktop/src/main/ipc/register-app-ipc.ts \
            apps/desktop/src/main/ipc/schemas.ts \
            apps/desktop/src/main/rules/rules-service.test.ts \
            apps/desktop/src/main/rules/rules-service.ts \
            apps/desktop/src/preload/index.ts \
            apps/desktop/src/preload/types.ts \
            apps/desktop/src/renderer/src/components/Sidebar.tsx \
            apps/desktop/src/renderer/src/components/ui/CollapsibleMotion.tsx \
            apps/desktop/src/renderer/src/features/files/FilesPanel.tsx \
            apps/desktop/src/renderer/src/features/inspector/Inspector.tsx \
            apps/desktop/src/renderer/src/features/settings/SettingsPanel.tsx \
            apps/desktop/src/shared/contracts.ts
          printf '%s' "$COMMIT_MSG" | git commit -F -
          git rm -rf .github/agent-staging
          git rm -f .github/workflows/apply-settings-polish.yml
          git commit -m "chore: remove settings-polish apply staging"
          git push
