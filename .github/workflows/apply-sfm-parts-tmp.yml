name: apply-sfm-parts-tmp
on:
  push:
    branches: [cursor/session-font-motion-5588]
    paths:
      - .github/workflows/apply-sfm-parts-tmp.yml
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-sfm-parts]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/session-font-motion-5588
      - name: Assemble payload, commit sources, self-delete
        run: |
          set -euo pipefail
          rm -f .github/tmp-sfm/part02-test.b64
          cat .github/tmp-sfm/part[0-9][0-9].b64 | tr -d '\n' > /tmp/p.b64
          python3 - <<'PY'
          import base64, gzip, io, zipfile, pathlib
          raw = pathlib.Path('/tmp/p.b64').read_text().encode()
          data = gzip.decompress(base64.b64decode(raw))
          with zipfile.ZipFile(io.BytesIO(data)) as zf:
              for name in zf.namelist():
                  content = zf.read(name)
                  path = pathlib.Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
                  print('wrote', path, len(content))
          sidebar = pathlib.Path('apps/desktop/src/renderer/src/components/Sidebar.tsx').read_text()
          assert 'SB_SESSION' in sidebar
          assert 'calc(var(--text-xs)*0.95)' in sidebar
          assert 'AnimatePresence' in sidebar
          inspector = pathlib.Path('apps/desktop/src/renderer/src/features/inspector/Inspector.tsx').read_text()
          assert 'ContentTransition' in inspector
          approval = pathlib.Path('apps/desktop/src/renderer/src/features/agent/ApprovalPanel.tsx').read_text()
          assert 'm.section' in approval
          print('markers ok')
          PY
          git config user.name "cursor[bot]"
          git config user.email "cursor[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src/renderer/src/features/inspector/Inspector.tsx \
            apps/desktop/src/renderer/src/features/inspector/SubagentsPanel.tsx \
            apps/desktop/src/renderer/src/components/Sidebar.tsx \
            apps/desktop/src/renderer/src/features/composer/Composer.tsx
          git commit -m "fix(ui): shrink session fonts 5% and fill motion gaps"
          rm -rf .github/tmp-sfm .github/workflows/apply-sfm-parts-tmp.yml
          git add -A .github/
          git commit -m "chore: remove temporary sfm apply artifacts"
          git push origin HEAD:cursor/session-font-motion-5588
