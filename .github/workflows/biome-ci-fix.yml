name: biome-ci-fix
on:
  push:
    paths:
      - .github/workflows/biome-ci-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/upstream-ui-polish-5588
      - name: Apply biome CI fixes
        run: |
          set -euo pipefail
          git apply .github/agent-staging/biome-ci.patch
          rm -f .github/agent-staging/biome-ci.patch
          rmdir .github/agent-staging 2>/dev/null || true
          rm -f .github/workflows/biome-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(ui): satisfy biome check for CI"
          git push
