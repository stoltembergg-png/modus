name: apply-unify-tmp
on:
  push:
    branches: [cursor/unify-type-icons-5588]
    paths:
      - .github/workflows/apply-unify-tmp.yml
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-unify]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/unify-type-icons-5588
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply unify patches, verify, cleanup
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, pathlib, subprocess
          root = pathlib.Path('.github/tmp-unify')
          css = base64.b64decode((root / 'css.patch.b64').read_text())
          pathlib.Path('/tmp/app.css.patch').write_bytes(css)
          subprocess.check_call(['git', 'apply', '/tmp/app.css.patch'])
          parts = sorted(root.glob('py-*.b64'))
          if len(parts) != 5:
              raise SystemExit('expected 5 py parts, got %d: %s' % (len(parts), [p.name for p in parts]))
          py = base64.b64decode(''.join(p.read_text() for p in parts))
          pathlib.Path('/tmp/apply_remaining.py').write_bytes(py)
          subprocess.check_call(['python3', '/tmp/apply_remaining.py'])
          css_text = pathlib.Path('apps/desktop/src/renderer/src/styles/app.css').read_text()
          if '--ui-scale: 1.1;' not in css_text:
              raise SystemExit('missing --ui-scale: 1.1')
          if '--ui-scale: 1.15;' in css_text:
              raise SystemExit('still has --ui-scale: 1.15')
          if '.conversation-type {' in css_text:
              raise SystemExit('conversation-type still present')
          print('CSS verified')
          PY
          rm -rf .github/tmp-unify
          rm -f .github/workflows/apply-css-tmp.yml
          rm -f .github/workflows/apply-unify-tmp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix(ui): unify type ramp and icon ladder app-wide"
          git push
