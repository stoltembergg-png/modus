name: apply-css-tmp
on:
  push:
    branches: [cursor/unify-type-icons-5588]
    paths:
      - .github/workflows/apply-css-tmp.yml
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-css]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/unify-type-icons-5588
      - name: Apply app.css patch, commit, self-delete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          patch = base64.b64decode("""""").decode()
          pathlib.Path('/tmp/app.css.patch').write_text(patch)
          PY
          git apply /tmp/app.css.patch || patch -p1 < /tmp/app.css.patch
          grep -q '--ui-scale: 1.1' apps/desktop/src/renderer/src/styles/app.css
          if grep -q 'conversation-type' apps/desktop/src/renderer/src/styles/app.css; then
            echo 'conversation-type still present after patch' >&2
            exit 1
          fi
          git config user.name "cursor[bot]"
          git config user.email "cursor[bot]@users.noreply.github.com"
          git add apps/desktop/src/renderer/src/styles/app.css
          git commit -m "fix(ui): unify type ramp and icon ladder app-wide"
          rm -rf .github/tmp-unify .github/workflows/apply-css-tmp.yml
          git add -A .github/
          git commit -m "chore: remove temporary apply-css staging" || true
          git push origin HEAD:cursor/unify-type-icons-5588
