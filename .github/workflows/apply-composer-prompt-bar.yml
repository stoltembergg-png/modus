name: apply-composer-prompt-bar
on:
  push:
    branches: [cursor/composer-prompt-bar-ui-5588]
    paths:
      - .github/workflows/apply-composer-prompt-bar.yml
      - .github/agent-staging/composer-prompt-bar.patch
permissions:
  contents: write
concurrency:
  group: apply-composer-prompt-bar
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/composer-prompt-bar-ui-5588
          fetch-depth: 0
      - name: Apply staged Prompt Bar composer patch
        run: |
          set -euo pipefail
          STAGING=".github/agent-staging"
          PATCH="$STAGING/composer-prompt-bar.patch"
          test -f "$PATCH"
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/agent-staging/composer-prompt-bar.patch")
          text = p.read_text()
          bad = '-                          onClick={() => void onModelConfigChange?.(current.id, "off")}>'
          good = '-                          onClick={() => void onModelConfigChange?.(current.id, "off")}\n-                        >'
          if bad in text:
              p.write_text(text.replace(bad, good, 1))
              print("fixed mangled off-handler line")
          else:
              print("patch line ok")
          PY
          patch -p1 < "$PATCH"
          rm -rf "$STAGING"
          rm -f .github/workflows/apply-composer-prompt-bar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat(composer): Prompt Bar dual chips for model and effort"
          git push
