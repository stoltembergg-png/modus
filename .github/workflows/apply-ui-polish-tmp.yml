name: apply-ui-polish-tmp
on:
  push:
    branches: [cursor/react-bits-ui-polish-5588]
    paths:
      - ".github/agent-staging/ui-polish-READY"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/react-bits-ui-polish-5588
      - name: Decode apply commit cleanup
        run: |
          set -euo pipefail
          : > /tmp/b64
          for i in 00 01 02; do
            cat ".github/agent-staging/ui-polish.b64.$i" >> /tmp/b64
          done
          base64 -d /tmp/b64 | gunzip > /tmp/ui-polish.patch
          git apply --index /tmp/ui-polish.patch
          rm -rf .github/agent-staging .cursor-tmp
          rm -f .github/workflows/apply-ui-polish-tmp.yml
          git add -A
          git config user.name "Gabriel"
          git config user.email "stoltembergg@gmail.com"
          git status --short
          git commit -m "feat(ui): ThoughtLine, PromptBar send morph, FadeContent, +15% scale"
          git push
